name: Plan extractor release
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/fetch_blender_build_assets.ps1', 'Dockerfile', 'requirements.txt', 'infra/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Rollback: retained sha256 digest; blank reuses the current image'
        type: string
        default: ''
      adoption:
        description: 'Import-only baseline; reject effective resource changes'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: terraform-production
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  ECR_URI: 001879457662.dkr.ecr.us-east-1.amazonaws.com/cg-metadata-extractor
  BLENDER_ARTIFACT_BUCKET: cg-extractor-build-artifacts-001879457662-us-east-1
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Validate configuration and release guards
        run: |
          terraform -chdir=infra fmt -check
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate
          python -m unittest discover -s infra/tools -p 'test_*.py'
          python -m unittest discover -s testing -p test_gap_splitting.py
      - name: Detect application changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          changed=false
          if [ "$EVENT" = push ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=true
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src scripts/fetch_blender_build_assets.ps1 Dockerfile requirements.txt; then
              changed=true
            fi
          fi
          echo "build=$changed" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.changes.outputs.build == 'true'
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-extractor-build
          aws-region: us-east-1
      - name: Fetch verified Blender build assets
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: ./scripts/fetch_blender_build_assets.ps1 -BucketName $env:BLENDER_ARTIFACT_BUCKET
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.changes.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.build == 'true'
      - name: Build or reuse commit image
        if: steps.changes.outputs.build == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          commit_tag="sha-$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name cg-metadata-extractor --image-ids "imageTag=$commit_tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)

          next_version_tag() {
            local latest=0
            local candidate
            for candidate in $(aws ecr list-images --repository-name cg-metadata-extractor --query 'imageIds[*].imageTag' --output text); do
              if [[ "$candidate" =~ ^v([0-9]+)$ ]] && (( 10#${BASH_REMATCH[1]} > latest )); then
                latest=$((10#${BASH_REMATCH[1]}))
              fi
            done
            echo "v$((latest + 1))"
          }

          if [ -z "$digest" ]; then
            version_tag=$(next_version_tag)
            available=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "$available" -lt 25000000 ]; then
              echo 'Build needs at least 25 GB free disk. Select a larger GitHub runner.' >&2
              exit 1
            fi
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -t "$ECR_URI:$commit_tag" -t "$ECR_URI:$version_tag" .
            digest=$(aws ecr describe-images --repository-name cg-metadata-extractor --image-ids "imageTag=$commit_tag" --query 'imageDetails[0].imageDigest' --output text)
          else
            version_tag=$(aws ecr describe-images --repository-name cg-metadata-extractor --image-ids "imageDigest=$digest" --query 'imageDetails[0].imageTags' --output text | tr '\t' '\n' | awk '/^v[0-9]+$/ { print; exit }')
            if [ -z "$version_tag" ]; then
              version_tag=$(next_version_tag)
              manifest=$(aws ecr batch-get-image --repository-name cg-metadata-extractor --image-ids "imageDigest=$digest" --query 'images[0].imageManifest' --output text)
              aws ecr put-image --repository-name cg-metadata-extractor --image-tag "$version_tag" --image-manifest "$manifest" > /dev/null
            fi
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published $ECR_URI:$version_tag ($commit_tag)"
          echo "uri=$ECR_URI@$digest" >> "$GITHUB_OUTPUT"
  plan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::001879457662:role/github-cg-extractor-plan
          aws-region: us-east-1
      - name: Save private plan for review
        env:
          BUILT_IMAGE: ${{ needs.build.outputs.image_uri }}
          ROLLBACK_DIGEST: ${{ inputs.image_digest }}
          ADOPTION: ${{ inputs.adoption }}
        run: |
          set -euo pipefail
          if [ "$ADOPTION" = true ]; then
            python infra/tools/release.py plan --adoption
          else
            image="$BUILT_IMAGE"
            if [ -n "$ROLLBACK_DIGEST" ]; then
              [[ "$ROLLBACK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
              aws ecr describe-images --repository-name cg-metadata-extractor --image-ids "imageDigest=$ROLLBACK_DIGEST" > /dev/null
              image="$ECR_URI@$ROLLBACK_DIGEST"
            elif [ -z "$image" ]; then
              image=$(python infra/tools/image.py)
            fi
            python infra/tools/release.py plan --image-uri "$image"
          fi
